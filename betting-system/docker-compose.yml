version: '3.8'

services:
  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - betting-net

  app:
    build: .
    restart: always
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/betting
      - JWT_SECRET=betting-system-jwt-secret-2024
      - ADMIN_PASSWORD=admin123
    depends_on:
      - mongo
    networks:
      - betting-net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - betting-net

volumes:
  mongo_data:

networks:
  betting-net:
    driver: bridge
